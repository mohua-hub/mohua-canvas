name: Build Desktop

on:
  workflow_dispatch:

  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        os:
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Install deps
        run: npm install

      - name: Build Tauri
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: src-tauri/target/release/bundle
