name: Release Desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '发布已有标签；留空只构建所选分支，不创建 Release'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2022
            name: windows-x64
            bundles: nsis,msi
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Check release version
        env:
          RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: node -e "const fs=require('fs'); const v=fs.readFileSync('VERSION','utf8').trim().replace(/^v/,''); if(process.env.RELEASE_TAG && process.env.RELEASE_TAG !== 'v'+v) throw new Error('Tag must match VERSION');"
      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Verify updater signing key
        if: matrix.name == 'windows-x64'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node -e "if (!process.env.TAURI_SIGNING_PRIVATE_KEY) throw new Error('Set the TAURI_SIGNING_PRIVATE_KEY repository Actions secret before building signed auto-updates.');"
      - name: Build desktop installer
        env:
          CI: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
          TAURI_SIGNING_PRIVATE_KEY: ${{ matrix.name == 'windows-x64' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
        run: node scripts/desktop.mjs build --bundles ${{ matrix.bundles }} ${{ matrix.name == 'windows-x64' && '--config src-tauri/tauri.updater.conf.json' || '' }} -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 7
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: installers
          merge-multiple: true
      - name: Generate updater manifest
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/create-updater-manifest.mjs "$RELEASE_TAG" installers
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          node scripts/release-notes.mjs "$RELEASE_TAG" > release-notes.md
          mapfile -d '' packages < <(find installers -type f -print0)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${packages[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${packages[@]}" --verify-tag --title "Mohua Canvas $RELEASE_TAG" --notes-file release-notes.md
          fi
